name: sync characters

# Refresh the offline seed from the published asset library.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download characters.json from the asset library
        run: curl -fsSL https://raw.githubusercontent.com/LLsetnow/Brown-Dust-2-Asset/master/characters.json -o public/data/characters.json

      - name: Commit if changed
        run: |
          git diff --quiet public/data/characters.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh offline character catalog"
          git push
